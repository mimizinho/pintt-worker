<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pintt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #060505;
    --black-soft: #121011;
    --red: #ea1f2d;
    --red-deep: #7c0c14;
    --white: #f7f5f4;
    --muted: #9a9192;
    --line: rgba(247,245,244,0.10);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(234,31,45,0.28), transparent 65%),
      linear-gradient(190deg, #0a0808 0%, #170707 45%, #2c0a0d 100%);
    color:var(--white);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .glow{
    position:fixed;
    top:-160px; left:50%;
    transform:translateX(-50%);
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(234,31,45,0.35), transparent 70%);
    filter:blur(10px);
    pointer-events:none;
    z-index:0;
    animation: pulse-glow 6s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%,100%{ opacity:0.7; }
    50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){ .glow{ animation:none; } }

  .page{
    position:relative; z-index:1;
    width:100%; max-width:460px;
    padding:34px 22px 40px;
    display:flex; flex-direction:column;
    align-items:center;
  }

  /* ---------- splash / entrance animation ---------- */
  #splash{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(60% 40% at 50% 45%, rgba(234,31,45,0.30), transparent 65%),
      linear-gradient(190deg, #0a0808 0%, #170707 45%, #2c0a0d 100%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  #splash img{
    width:120px; height:120px;
    border-radius:28px;
    opacity:0;
    transform:scale(0.7);
    filter:blur(6px);
    animation: splash-pop .9s cubic-bezier(.2,1,.3,1) forwards;
  }
  @keyframes splash-pop{
    0%{ opacity:0; transform:scale(0.7); filter:blur(6px); box-shadow:0 0 0 rgba(234,31,45,0); }
    55%{ opacity:1; transform:scale(1.04); filter:blur(0); box-shadow:0 0 40px rgba(234,31,45,0.5); }
    100%{ opacity:1; transform:scale(1); filter:blur(0); box-shadow:0 10px 28px -8px rgba(234,31,45,0.6); }
  }
  @media (prefers-reduced-motion: reduce){
    #splash img{ animation:none; opacity:1; transform:none; filter:none; }
  }

  .logo{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-bottom:26px;
  }
  .logo img{
    width:88px; height:88px;
    border-radius:22px;
    box-shadow:0 10px 26px -8px rgba(234,31,45,0.65);
  }
  .logo .word{
    font-family:'Baloo 2', 'Inter', sans-serif;
    font-size:26px; font-weight:800; letter-spacing:-0.4px;
    color:var(--white);
    display:flex; align-items:center;
  }
  .logo .word span{ color:var(--red); }
  .badge-dot{
    display:inline-flex; align-items:center; justify-content:center;
    width:17px; height:17px; border-radius:50%;
    background:linear-gradient(135deg, var(--red), var(--red-deep));
    box-shadow:0 0 8px rgba(234,31,45,0.6);
    margin-left:3px;
    transform:translateY(2px);
  }
  .badge-dot svg{ width:9px; height:9px; }

  h1{
    font-size:clamp(26px, 7vw, 32px);
    font-weight:800;
    line-height:1.2;
    text-align:center;
    margin:0 0 8px;
    letter-spacing:-0.5px;
  }
  h1 span{
    background:linear-gradient(100deg, var(--white) 30%, var(--red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:14.5px;
    text-align:center;
    margin:0 0 26px;
  }

  .card{
    width:100%;
    background:rgba(18,16,17,0.65);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.8), 0 0 0 1px rgba(234,31,45,0.06);
    display:flex; flex-direction:column; gap:8px;
  }
  .card input{
    width:100%;
    background:transparent;
    border:none; outline:none;
    color:var(--white);
    font-size:15px;
    padding:14px 14px 6px;
    font-family:'Inter', sans-serif;
  }
  .card input::placeholder{ color:#6f6667; }

  .go-btn{
    width:100%;
    background:linear-gradient(135deg, var(--red) 0%, var(--red-deep) 100%);
    border:none;
    color:#fff;
    font-weight:700;
    font-size:16px;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:filter .15s ease, transform .1s ease;
  }
  .go-btn:hover{ filter:brightness(1.08); }
  .go-btn:active{ transform:scale(0.98); }
  .go-btn:disabled{ opacity:0.55; cursor:progress; }

  .status{
    width:100%;
    margin-top:12px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13.5px;
    line-height:1.5;
    display:none;
    background:rgba(234,31,45,0.10);
    border:1px solid rgba(234,31,45,0.25);
    color:#f5c3c6;
  }
  .status.show{ display:block; }

  .result{
    width:100%;
    margin-top:16px;
    background:var(--black-soft);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:none;
  }
  .result.show{ display:block; }
  .result video{
    width:100%; max-height:360px;
    background:#000; display:block;
    object-fit:contain;
  }
  .result-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:12px 14px;
  }
  .result-title{
    font-size:13px; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  .dl-btn{
    background:var(--white); color:var(--black);
    border:none; font-weight:700; font-size:13.5px;
    padding:10px 16px; border-radius:9px;
    cursor:pointer; text-decoration:none; white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px;
  }

  .trust{
    display:flex; gap:22px; margin-top:30px;
  }
  .trust-item{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    font-size:12px; color:var(--muted);
  }
  .trust-item .ic{
    width:34px; height:34px; border-radius:50%;
    background:rgba(234,31,45,0.12);
    border:1px solid rgba(234,31,45,0.3);
    display:flex; align-items:center; justify-content:center;
    color:var(--red);
  }

  footer{
    margin-top:auto;
    padding:26px 22px 10px;
    text-align:center;
    color:#5c5455;
    font-size:11.5px;
    max-width:460px;
  }
</style>
</head>

<script>
  // Entrance animation: hide splash after the logo animation plays
  window.addEventListener('load', () => {
    const splash = document.getElementById('splash');
    const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 200 : 2000;
    setTimeout(() => splash.classList.add('hide'), delay);
  });

  // ---------------------------------------------------------------
  // O navegador não acessa diretamente as páginas do Pinterest por
  // causa de CORS. Este front-end espera um backend/proxy próprio
  // (ex.: Cloudflare Worker) que:
  //   1) recebe a URL do pin em GET /api/resolve?url=...
  //   2) busca o HTML da página do pin
  //   3) extrai a URL do vídeo original (og:video / JSON da página)
  //      e o título
  //   4) devolve JSON: { videoUrl, title }
  // Troque API_ENDPOINT abaixo pela URL do seu Worker.
  // ---------------------------------------------------------------
  const API_ENDPOINT = "https://pintt-resolver.franciscoviei123.workers.dev/api/resolve";

  const input = document.getElementById('pin-url');
  const btn = document.getElementById('fetch-btn');
  const btnLabel = document.getElementById('btn-label');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const preview = document.getElementById('preview');
  const downloadLink = document.getElementById('download-link');
  const resultTitle = document.getElementById('result-title');
  let currentDownloadUrl = null;
  let currentFilename = 'pintt-video.mp4';

  function showStatus(message){
    statusEl.textContent = message;
    statusEl.classList.add('show');
  }
  function hideStatus(){ statusEl.classList.remove('show'); }
  function isPinterestUrl(url){
    return /pinterest\.[a-z.]+\/pin\//i.test(url) || /pin\.it\//i.test(url);
  }

  async function handleFetch(){
    const url = input.value.trim();
    hideStatus();
    resultEl.classList.remove('show');

    if(!url){
      showStatus('Cole o link de um pin do Pinterest para continuar.');
      return;
    }
    if(!isPinterestUrl(url)){
      showStatus('Esse link não parece ser de um pin do Pinterest.');
      return;
    }

    btn.disabled = true;
    btnLabel.textContent = 'Buscando...';

    try{
      const response = await fetch(API_ENDPOINT + '?url=' + encodeURIComponent(url));
      if(!response.ok) throw new Error('backend_error');
      const data = await response.json();
      if(!data.videoUrl) throw new Error('no_video');

      currentDownloadUrl = API_ENDPOINT.replace('/api/resolve', '/api/download')
        + '?url=' + encodeURIComponent(data.videoUrl)
        + '&filename=' + encodeURIComponent(data.title || 'pintt-video');
      currentFilename = (data.title || 'pintt-video') + '.mp4';

      preview.src = data.videoUrl;
      resultTitle.textContent = data.title || 'vídeo encontrado';
      resultEl.classList.add('show');
    }catch(err){
      showStatus('Não foi possível conectar ao serviço de extração. Configure o endpoint do backend (API_ENDPOINT) — veja o comentário no código.');
    }finally{
      btn.disabled = false;
      btnLabel.textContent = 'Baixar vídeo';
    }
  }

  // Baixa o vídeo via JS (fetch + blob) em vez de navegar até a URL,
  // assim a página nunca sai do lugar e a barra de endereço não muda.
  async function handleDownloadClick(e){
    e.preventDefault();
    if(!currentDownloadUrl) return;

    const originalText = downloadLink.textContent;
    downloadLink.textContent = 'Baixando...';
    try{
      const res = await fetch(currentDownloadUrl);
      if(!res.ok) throw new Error('download_failed');
      const blob = await res.blob();
      const blobUrl = URL.createObjectURL(blob);

      const tempLink = document.createElement('a');
      tempLink.href = blobUrl;
      tempLink.download = currentFilename;
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
      URL.revokeObjectURL(blobUrl);
    }catch(err){
      showStatus('Não foi possível baixar o vídeo. Tente novamente.');
    }finally{
      downloadLink.textContent = originalText;
    }
  }

  downloadLink.addEventListener('click', handleDownloadClick);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleFetch(); });
</script>
</body>
</html>
